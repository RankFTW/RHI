name: Сборка инсталлятора (RU)

# Собирает русифицированный RHI-Setup.exe и выкладывает его в артефакты задачи.
# Запуск: вкладка Actions → «Сборка инсталлятора (RU)» → Run workflow
# (или автоматически при пуше в main).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'todo/**'
      - 'screenshots/**'

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Публикация RHI (WinUI 3)
        run: >
          dotnet publish RenoDXCommander/RenoDXCommander.csproj
          -c Release -r win-x64 -p:PublishSingleFile=true -p:Platform=x64
          --self-contained false -o publish/RHI

      - name: Сборка DropHelper
        run: |
          dotnet build RHI.DropHelper/RHI.DropHelper.csproj -c Release -v quiet
          $bin = "RHI.DropHelper/bin/x64/Release/net8.0-windows"
          $out = "publish/RHI"
          foreach ($f in @("RHI.DropHelper.exe", "RHI.DropHelper.runtimeconfig.json")) {
            if (Test-Path "$bin/$f") { Copy-Item "$bin/$f" $out -Force }
          }
          if (Test-Path "$bin/RHI.DropHelper.dll") { Copy-Item "$bin/RHI.DropHelper.dll" $out -Force }

      - name: Копирование сопутствующих файлов
        run: |
          $src = "RenoDXCommander"
          $out = "publish/RHI"
          $files = @(
            "icon.ico", "7z.exe", "7z.dll",
            "ReShade.ini", "ReShade.Vulkan.ini", "ReShade64.json",
            "RHI_PatchNotes.md", "relimiter.ini", "reshade.rdr2.ini",
            "OptiScaler_nightly.nvidia.ini", "OptiScaler_nightly.amd-dlss.ini", "OptiScaler_nightly.amd-nodlss.ini",
            "OptiScaler_dlssnr.nvidia.ini", "OptiScaler_dlssnr.amd-dlss.ini", "OptiScaler_dlssnr.amd-nodlss.ini",
            "OptiScaler.nvidia.ini", "OptiScaler.amd-dlss.ini", "OptiScaler.amd-nodlss.ini"
          )
          foreach ($f in $files) {
            if (Test-Path "$src/$f") { Copy-Item "$src/$f" $out -Force }
          }
          New-Item -ItemType Directory -Force -Path "$out/Assets/icons" | Out-Null
          if (Test-Path "$src/Assets/icons") { Copy-Item "$src/Assets/icons/*" "$out/Assets/icons/" -Force }

      - name: Установка Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Компиляция инсталлятора (русский)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $pub = (Resolve-Path "publish/RHI").Path
          $icon = (Resolve-Path "RenoDXCommander/icon.ico").Path
          $outDir = Join-Path (Get-Location).Path "Installers"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          & $iscc "/DPublishDir=$pub" "/DIconFile=$icon" "/DInstallerOutDir=$outDir" "RHI Setup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: RHI-Setup-RU
          path: Installers/RHI-Setup.exe
          if-no-files-found: error
